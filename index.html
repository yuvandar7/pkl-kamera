<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0B4F8A">
<title>Kamera Laporan — Sistem Pemantauan Siswa PKL</title>
<!--
  HALAMAN KAMERA — Sistem Pemantauan Siswa PKL (file statis, BUKAN backend)
  Mengapa ada halaman ini? Sejak 2026 Google memblokir kamera (getUserMedia) dan
  izin sensitif lain di dalam Web App Apps Script ("Permissions policy violation").
  Solusi resmi Google: jalankan fungsi kamera di halaman terpisah (domain lain),
  buka di jendela baru, lalu kirim hasilnya kembali ke aplikasi.
  Halaman ini: membuka kamera belakang secara langsung, mengambil GPS, lalu
  mengirim foto + GPS ke tab aplikasi melalui window.postMessage. Tidak ada data
  yang disimpan/dikirim ke server lain. Tidak ada input file / galeri.
  Hosting: GitHub Pages (gratis) atau hosting statis HTTPS lain.
-->
<style>
  :root { --p:#0B4F8A; --p2:#1769AA; --navy:#102A43; --bg:#F4F7FB; --t:#172B4D; --t2:#64748B; --b:#E3E9F1; --ok:#16A34A; --okbg:#EAF7EE; --warn:#B45309; --warnbg:#FEF6E7; --err:#B91C1C; --errbg:#FDEDED; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--t); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
  header { background: #fff; border-bottom: 1px solid var(--b); padding: 10px 16px; display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 5; }
  header img { width: 34px; height: 34px; object-fit: contain; }
  header .t { font-weight: 800; font-size: 14px; color: var(--navy); letter-spacing: .01em; }
  header .s { font-size: 11.5px; color: var(--t2); }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom)); }
  .cam { position: relative; background: #0B1220; border-radius: 18px; overflow: hidden; aspect-ratio: 3 / 4; max-height: 68vh; width: 100%; display: flex; align-items: center; justify-content: center; }
  .cam video, .cam img { width: 100%; height: 100%; object-fit: cover; }
  .cam video.mirror { transform: scaleX(-1); }
  .state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #CBD5E1; text-align: center; padding: 24px; }
  .state .t { color: #fff; font-weight: 700; font-size: 16px; }
  .state .d { font-size: 13.5px; max-width: 320px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  .live { background: rgba(220,38,38,.92); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 3px 10px; letter-spacing: .05em; }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .shutter::after { content: ''; width: 56px; height: 56px; border-radius: 50%; background: #fff; transition: transform .1s; }
  .shutter:active::after { transform: scale(.88); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0; font: inherit; font-weight: 650; font-size: 15px; cursor: pointer; }
  .btn.primary { background: var(--p); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
  .btn.light { background: #fff; color: var(--t); border: 1px solid var(--b); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  .card { background: #fff; border: 1px solid var(--b); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
  .gps { display: flex; gap: 12px; align-items: center; }
  .gps .ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: #EAF2FA; color: var(--p); font-weight: 800; flex-shrink: 0; }
  .gps .ic.ok { background: var(--okbg); color: var(--ok); }
  .gps .ic.err { background: var(--errbg); color: var(--err); }
  .gps .grow { flex: 1; min-width: 0; }
  .gps .h { font-weight: 650; font-size: 14px; }
  .gps .s { font-size: 12.5px; color: var(--t2); }
  .note { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
  .note.err { background: var(--errbg); color: #991B1B; }
  .note.warn { background: var(--warnbg); color: #92400E; }
  .note.ok { background: var(--okbg); color: #166534; }
  .note.info { background: #E8F1FA; color: #0E4A7A; }
  .hint { font-size: 12.5px; color: var(--t2); text-align: center; margin-top: 14px; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row .btn { flex: 1; }
  .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; }
  .spin.dark { border-color: #D3E4F5; border-top-color: var(--p); }
  @keyframes s { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>

<main>

  <div class="cam" id="cam"></div>

<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var nonce = qs.get('n') || '';
  var target = qs.get('o') || '';
  var maxPx = Math.min(parseInt(qs.get('mx') || '1600', 10) || 1600, 2048);
  var originOk = /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(target) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(target);
  var valid = !!(window.opener && /^[A-Za-z0-9-]{16,80}$/.test(nonce) && originOk);

  var S = { cam: 'idle', err: '', photo: null, facing: 'environment', gps: null, gpsState: 'idle', gpsErr: '', stream: null, sending: false, sent: false, cams: 0 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function note(type, html) { var n = $('note'); if (!type) { n.className = 'note hidden'; return; } n.className = 'note ' + type; n.innerHTML = html; }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(2) + ' MB' : Math.round(n / 1024) + ' KB'; }
  function bytesOf(u) { var b = u.slice(u.indexOf(',') + 1); return Math.floor(b.length * 3 / 4); }
  function fmtTime(t) { try { return new Date(t).toLocaleTimeString('id-ID', { timeZone: 'Asia/Makassar', hour12: false }); } catch (e) { return ''; } }

  if (!valid) {
    note('err', '<b>Halaman ini harus dibuka dari aplikasi.</b><br>Kembali ke aplikasi Sistem Pemantauan Siswa PKL, buka menu <b>Buat Laporan</b>, lalu tekan <b>Buka Kamera</b>.');
    $('cam').innerHTML = '<div class="state"><div class="t">Tidak ada permintaan foto</div></div>';
    $('gps').innerHTML = '<div class="s">GPS tidak diaktifkan.</div>';
    return;
  }

  /* ---------------- Kamera ---------------- */
  function camError(e) {
    var n = (e && e.name) || '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'Browser ini tidak mendukung kamera. Gunakan Google Chrome (Android) atau Safari (iPhone) terbaru.';
    if (/NotAllowed|Permission|Security/.test(n)) return 'Izin kamera ditolak. Ketuk ikon gembok/pengaturan situs di bilah alamat → izinkan Kamera, lalu tekan "Coba Lagi".';
    if (/NotFound|Overconstrained/.test(n)) return 'Kamera tidak ditemukan pada perangkat ini.';
    if (/NotReadable|TrackStart|Abort/.test(n)) return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/video call lalu coba lagi.';
    return 'Kamera tidak dapat diaktifkan (' + (n || 'kesalahan') + ').';
  }
  function stopCam() { if (S.stream) S.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { } }); S.stream = null; }

  function startCam() {
    stopCam(); S.cam = 'starting'; render();
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { S.cam = 'error'; S.err = camError({ name: 'NotSupportedError' }); render(); return; }
    md.getUserMedia({ audio: false, video: { facingMode: { ideal: S.facing }, width: { ideal: 1920 }, height: { ideal: 1440 } } })
      .catch(function (e) {
        if (e && /Overconstrained|NotFound/.test(e.name)) return md.getUserMedia({ audio: false, video: true });
        throw e;
      })
      .then(function (stream) {
        S.stream = stream; S.cam = 'live'; render();
        md.enumerateDevices().then(function (d) { S.cams = d.filter(function (x) { return x.kind === 'videoinput'; }).length; render(); }).catch(function () { });
      })
      .catch(function (e) { stopCam(); S.cam = 'error'; S.err = camError(e); render(); });
  }

  function shoot() {
    var v = $('v');
    if (!v || !v.videoWidth) return;
    var vw = v.videoWidth, vh = v.videoHeight, sc = Math.min(1, maxPx / Math.max(vw, vh));
    var c = document.createElement('canvas');
    c.width = Math.round(vw * sc); c.height = Math.round(vh * sc);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    var q = 0.9, url = c.toDataURL('image/jpeg', q);
    while (bytesOf(url) > 2.5 * 1048576 && q > 0.5) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
    S.photo = { image: url, width: c.width, height: c.height, takenAt: new Date().toISOString(), bytes: bytesOf(url) };
    stopCam();                                    // hentikan stream segera setelah foto diambil
    S.cam = 'preview'; render();
    if (S.gpsState !== 'loading' && (!S.gps || Date.now() - S.gps.timestamp > 120000)) getGps();
  }

  /* ---------------- GPS ---------------- */
  function getGps() {
    if (!('geolocation' in navigator)) { S.gpsState = 'error'; S.gpsErr = 'Browser tidak mendukung GPS.'; render(); return; }
    S.gpsState = 'loading'; render();
    navigator.geolocation.getCurrentPosition(function (p) {
      S.gps = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, timestamp: p.timestamp || Date.now() };
      S.gpsState = 'ok'; render();
    }, function (err) {
      S.gpsState = 'error';
      S.gpsErr = err.code === 1 ? 'Izin lokasi ditolak. Izinkan Lokasi untuk situs ini, lalu tekan Perbarui.' : err.code === 3 ? 'Waktu habis. Pastikan GPS aktif lalu tekan Perbarui.' : 'Lokasi tidak tersedia. Aktifkan GPS/Lokasi HP dan coba di area terbuka.';
      render();
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  }

  /* ---------------- Kirim ke aplikasi ---------------- */
  var ackTimer = null;
  function send() {
    if (!S.photo || S.sending) return;
    if (!window.opener || window.opener.closed) {
      note('err', 'Tab aplikasi sudah tertutup. Buka kembali aplikasi lalu ulangi dari menu <b>Buat Laporan</b>.'); return;
    }
    S.sending = true; render();
    window.opener.postMessage({
      type: 'sipkl-capture', v: 1, nonce: nonce, image: S.photo.image, width: S.photo.width, height: S.photo.height,
      takenAt: S.photo.takenAt, gps: S.gps, gpsError: S.gpsState === 'error' ? S.gpsErr : '', facing: S.facing,
      sentAt: new Date().toISOString(), ua: navigator.userAgent.slice(0, 160)
    }, target);
    clearTimeout(ackTimer);
    ackTimer = setTimeout(function () {
      if (S.sent) return;
      S.sending = false; render();
      note('warn', 'Aplikasi belum merespons. Pastikan tab aplikasi masih terbuka di halaman <b>Buat Laporan</b>, lalu tekan <b>Kirim ke Aplikasi</b> lagi.');
    }, 5000);
  }
  window.addEventListener('message', function (ev) {
    if (ev.origin !== target || !ev.data || ev.data.nonce !== nonce) return;
    if (ev.data.type === 'sipkl-capture-ack') {
      clearTimeout(ackTimer); S.sent = true; S.sending = false; render();
      setTimeout(function () { try { window.close(); } catch (e) { } }, 900);
    } else if (ev.data.type === 'sipkl-capture-error') {
      clearTimeout(ackTimer); S.sending = false; render();
      note('err', esc(ev.data.message || 'Foto ditolak aplikasi. Ambil ulang foto.'));
    }
  });

  /* ---------------- Tampilan ---------------- */
  function render() {
    var cam = $('cam'), act = $('actions'), h = '';
    if (S.sent) {
      cam.innerHTML = '<div class="state"><div class="t">✓ Foto terkirim ke aplikasi</div><div class="d">Jendela ini akan tertutup. Bila tidak, kembali ke tab aplikasi untuk melanjutkan laporan.</div></div>';
      act.innerHTML = '<div class="row"><button class="btn light block" id="close">Tutup jendela</button></div>';
      $('close').onclick = function () { window.close(); };
      renderGps(); note(null); return;
    }
    if (S.cam === 'live') {
      h = '<video id="v" playsinline muted autoplay' + (S.facing === 'user' ? ' class="mirror"' : '') + '></video>' +
        '<div class="top"><span class="live">● LIVE</span>' + (S.cams > 1 ? '<button class="btn ghost" id="sw" style="min-height:38px;font-size:13px">Ganti kamera</button>' : '') + '</div>' +
        '<div class="bar"><button class="btn ghost" id="cancel">Batal</button><button class="shutter" id="shot" aria-label="Ambil foto"></button><span style="width:78px"></span></div>';
    } else if (S.cam === 'starting') {
      h = '<div class="state"><div class="spin"></div><div class="t">Mengaktifkan kamera…</div><div class="d">Izinkan akses kamera bila diminta.</div></div>';
    } else if (S.cam === 'preview' && S.photo) {
      h = '<img src="' + S.photo.image + '" alt="Pratinjau"><div class="top"><span class="live" style="background:rgba(16,42,67,.85)">Pratinjau • ' + kb(S.photo.bytes) + '</span></div>';
    } else if (S.cam === 'error') {
      h = '<div class="state"><div class="t">Kamera tidak dapat digunakan</div><div class="d">' + esc(S.err) + '</div><button class="btn light" id="retry">Coba Lagi</button></div>';
    } else {
      h = '<div class="state"><div class="t">Kamera belum aktif</div><div class="d">Tekan tombol di bawah untuk mengaktifkan kamera belakang.</div><button class="btn primary" id="start">Aktifkan Kamera</button></div>';
    }
    cam.innerHTML = h;
    if (S.cam === 'live' && S.stream) { var v = $('v'); v.srcObject = S.stream; v.play().catch(function () { }); }
    if (S.cam === 'preview' && S.photo) {
      act.innerHTML = '<div class="row"><button class="btn light" id="retake">Ulangi</button><button class="btn ok" id="use"' + (S.sending ? ' disabled' : '') + '>' + (S.sending ? '<span class="spin"></span> Mengirim…' : 'Gunakan Foto & Kirim') + '</button></div>';
      $('retake').onclick = function () { S.photo = null; note(null); startCam(); };
      $('use').onclick = send;
    } else {
      act.innerHTML = '<div class="row"><button class="btn light block" id="back">Batal & kembali ke aplikasi</button></div>';
      $('back').onclick = function () { stopCam(); window.close(); };
    }
    var b;
    if ((b = $('start'))) b.onclick = startCam;
    if ((b = $('retry'))) b.onclick = startCam;
    if ((b = $('shot'))) b.onclick = shoot;
    if ((b = $('cancel'))) b.onclick = function () { stopCam(); S.cam = 'idle'; render(); };
    if ((b = $('sw'))) b.onclick = function () { S.facing = S.facing === 'environment' ? 'user' : 'environment'; startCam(); };
    renderGps();
  }

  function renderGps() {
    var g = S.gps, el = $('gps');
    if (S.gpsState === 'loading') el.innerHTML = '<div class="ic"><span class="spin dark"></span></div><div class="grow"><div class="h">Mengambil lokasi GPS…</div><div class="s">Pastikan GPS/Lokasi HP aktif.</div></div>';
    else if (S.gpsState === 'ok' && g) el.innerHTML = '<div class="ic ok">✓</div><div class="grow"><div class="h">Lokasi diperoleh • ±' + Math.round(g.accuracy) + ' m</div><div class="s">' + g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + ' • ' + fmtTime(g.timestamp) + ' WITA</div></div><button class="btn light" id="rg" style="min-height:38px;font-size:13px">Perbarui</button>';
    else if (S.gpsState === 'error') el.innerHTML = '<div class="ic err">!</div><div class="grow"><div class="h">Lokasi belum diperoleh</div><div class="s">' + esc(S.gpsErr) + '</div></div><button class="btn light" id="rg" style="min-height:38px;font-size:13px">Perbarui</button>';
    else el.innerHTML = '<div class="ic">⌖</div><div class="grow"><div class="h">Lokasi GPS</div></div><button class="btn light" id="rg" style="min-height:38px;font-size:13px">Ambil</button>';
    var r = $('rg'); if (r) r.onclick = getGps;
  }

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && S.cam === 'live') { stopCam(); S.cam = 'idle'; render(); } });
  window.addEventListener('pagehide', stopCam);

  render();
  getGps();
  startCam();
})();
</script>
</body>
</html>
